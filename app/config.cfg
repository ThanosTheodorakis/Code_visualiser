# Colours are r,g,b in 0..1. The values below are the built-in defaults;
# delete a line to get its default back.

# --- Shapes -------------------------------------------------------------
flowLineColor=0.60,0.66,0.76        # plain flow between steps
branchLineColor=1.00,0.68,0.15      # if / else fork
loopLineColor=0.25,0.85,0.45        # for / while / do-while
functionLineColor=0.35,0.62,1.00    # function boxes
connectorLineColor=0.85,0.60,1.00   # dashed "jump back" lines
statementLineColor=0.92,0.92,0.92   # single statements
inputLineColor=0.20,0.85,0.85       # console input
outputLineColor=1.00,0.45,0.75      # console output
terminalLineColor=0.95,0.42,0.42    # START / END

# Optional. If a line is missing it follows its group: switch and decision
# follow branchLineColor, iteration follows loopLineColor.
switchLineColor=1.00,0.68,0.15      # switch fork
decisionLineColor=1.00,0.68,0.15    # && || ?: operand forks
iterationLineColor=0.25,0.85,0.45   # one pass of a loop

# --- Other --------------------------------------------------------------
cursorColor=1.00,1.00,1.00          # the pulsing diamond: where execution is
backgroundColor=0.00,0.00,0.00      # window background

# A loop shows this many iterations, then one "N more iterations hidden" summary.
# 0 draws every iteration.
maxIterationsShown=6
